<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Under Maintenance | Dumiru Jayasekara</title>
<meta name="description" content="dumiru.me is currently under maintenance. We will be back shortly.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --paper:#fafafa;
    --ink:#111111;
    --muted:#6b6b6b;
    --line:rgba(0,0,0,.08);
    --orange:#ff6a00;
    --orange-soft:#fff1e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;z-index:-1}
  .b1{width:380px;height:380px;background:#ffd9bd;top:-120px;left:-120px}
  .b2{width:320px;height:320px;background:var(--orange-soft);bottom:-100px;right:-80px}

  .brand{font-size:18px;font-weight:500;margin-bottom:34px}
  .brand span{color:var(--orange)}

  .card{
    width:100%;max-width:560px;padding:50px 40px;border-radius:28px;
    background:rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 10px 36px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9);
    animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
  h1{font-size:clamp(26px,4.5vw,36px);font-weight:500;line-height:1.2;letter-spacing:-.01em;margin:14px 0 12px}
  p{color:var(--muted);font-size:15px;max-width:420px;margin:0 auto}

  .loader{display:flex;gap:8px;justify-content:center;margin:30px 0 8px}
  .loader i{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:bounce 1.2s infinite ease-in-out}
  .loader i:nth-child(2){animation-delay:.15s}
  .loader i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-8px);opacity:1}}

  .bar{height:6px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden;margin:26px auto 0;max-width:320px}
  .bar div{height:100%;width:40%;background:var(--orange);border-radius:999px;animation:slide 2.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:999px;
    font-size:15px;font-weight:500;border:1px solid transparent;transition:.3s ease;
  }
  .btn-orange{background:var(--orange);color:#fff;box-shadow:0 8px 22px rgba(255,106,0,.25)}
  .btn-orange:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,106,0,.35)}
  .btn-ghost{border-color:var(--line);background:#fff;color:var(--ink)}
  .btn-ghost:hover{border-color:var(--orange);color:var(--orange)}

  footer{position:absolute;bottom:20px;font-size:13px;color:var(--muted)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (max-width:520px){
    .card{padding:38px 24px}
    .actions .btn{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="brand">Dumiru <span>Jayasekara</span></div>

  <main class="card">
    <span class="eyebrow">Maintenance</span>
    <h1>This site is under maintenance</h1>
    <p>We're making some improvements to give you a better experience. We'll be back very soon.</p>

    <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="bar" aria-hidden="true"><div></div></div>

    <div class="actions">
      <a href="/client-portal" target="_blank" rel="noopener" class="btn btn-orange">Client Portal</a>
      <a href="mailto:hello@dumiru.me" class="btn btn-ghost">Email me</a>
    </div>
  </main>

  <footer>&copy; <span id="year"></span> Dumiru Jayasekara</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
